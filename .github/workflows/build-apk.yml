name: build-apk

# 没有 Android Studio 也能出 APK：
# 把整个 focus-guard 仓库推到 GitHub → Actions 自动构建 → 在 Artifacts 里下载 app-debug.apk

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "src/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 || true
          ls -la

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shouzhu-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
